[project]
name = "llm-gateway"
version = "0.1.0"
description = "A loopback LLM gateway: OpenAI Responses and Chat Completions in, Claude and Codex plans out."
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["aiohttp>=3.9", "claude-agent-sdk>=0.2.161"]

[project.scripts]
llm-gateway = "llm_gateway:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
