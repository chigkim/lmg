[project]
name = "llm-gateway"
version = "0.1.0"
description = "A loopback LLM gateway, jobs handed to agy, Claude Code and Codex, and what each plan has left: one command, lmg."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.9",
    "claude-agent-sdk>=0.2.161",
    "python-dotenv>=1.0",
]

[project.scripts]
lmg = "llm_gateway:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
# Only the tool's own tests: jobs/, from before lmg ask stopped making worktrees, holds other repositories' tests.
testpaths = ["tests"]
