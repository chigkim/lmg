[project]
name = "askai"
version = "0.1.0"
description = "Hand one job to agy, Claude Code or Codex in its own git worktree, and watch how much of each plan's windows is left."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
askai = "askai.ask:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
