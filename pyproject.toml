[project]
name = "ask-ai"
version = "0.1.0"
description = "Hand one job to agy, Claude Code or Codex in its own git worktree, and record what it spent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["ai-usage"]

[project.scripts]
ask-ai = "ask_ai.ask:main"

[tool.uv.sources]
ai-usage = { path = "../ai-usage", editable = true }

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
